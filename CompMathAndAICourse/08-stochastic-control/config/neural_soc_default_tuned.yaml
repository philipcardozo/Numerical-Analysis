# Neural Stochastic Optimal Control - Default Target (NO BSDE penalty)
#
# Configuration for origin-centered problem with log terminal cost.
# Based on shifted target HPO results, adapted for default problem.
#
# Usage:
#   python train.py config/neural_soc_default_tuned.yaml

method: neural_soc

problem:
  d: 100
  T: 1.0
  shifted_target: false
  terminal_cost_type: log
  seed: 42

network:
  architecture: resnet
  hidden_width: 256
  depth: 6

solver:
  n_steps: 10

training:
  learning_rate: 0.000906
  lr_decay: 0.923
  lr_decay_steps: 1000
  max_iterations: 5000
  batch_size: 256
  print_freq: 100
  val_freq: 200
  patience: 500
  n_val_samples: 128
  n_mc_samples: 10000

# Loss weights (BSDE penalty disabled!)
loss_weights:
  w_control_objective: 97.68
  w_terminal_match: 5.21
  w_terminal_gradient: 2.91
  w_hjb_residual: 8.04
  w_bsde_martingale: 0.0

output:
  output_dir: results/neural_soc_default_tuned
  save_history: true
  save_model: true
