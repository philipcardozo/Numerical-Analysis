# SGD with Momentum on Peaks - Small Network (width=32)
# Tuned hyperparameters from HPO

experiment:
  name: "SGD with Momentum on Peaks (Small-scale)"
  seed: 42

data:
  type: peaks_classification
  n_samples: 1000
  n_classes: 5
  train_fraction: 0.8
  x_range: [-3, 3]
  y_range: [-3, 3]

model:
  type: mlp
  layer_sizes: [2, 32, 5]

optimizer:
  type: sgd_momentum
  max_iter: 1000
  learning_rate: 0.12262266367377402
  momentum: 0.7196755535726115
  batch_size: 16
  lr_decay: 0.9
